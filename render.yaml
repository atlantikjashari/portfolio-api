# Render Blueprint: New > Blueprint > pick this repo. Secrets marked sync:false are asked for in the dashboard.
services:
  - type: web
    name: portfolio-api
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: bash ./build.sh # bash: works even if git did not record the executable bit (Windows)
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 2 --timeout 60 --access-logfile -
    healthCheckPath: /api/health/
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false # Neon connection string (with ?sslmode=require)
      - key: CORS_ALLOWED_ORIGINS
        sync: false # e.g. https://atlantik-portfolio.pages.dev
      - key: CORS_ALLOWED_ORIGIN_REGEX
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false # e.g. https://portfolio-api.onrender.com
      - key: NUM_PROXIES
        value: "1"
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: Portfolio <onboarding@resend.dev>
      - key: CONTACT_NOTIFY_EMAIL
        sync: false
      - key: DEMO_USERNAME
        value: demo
      - key: DEMO_PASSWORD
        value: demo-portfolio-2026
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
